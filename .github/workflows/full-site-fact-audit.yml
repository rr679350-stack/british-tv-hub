name: Full Sitewide Fact Audit

on:
  push:
    paths:
      - 'scripts/full_site_fact_audit.py'
      - '.github/workflows/full-site-fact-audit.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: full-site-fact-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Verify every page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/full_site_fact_audit.py
      - name: Save full fact audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-fact-audit
          path: full-fact-audit/
          retention-days: 30
          if-no-files-found: warn
