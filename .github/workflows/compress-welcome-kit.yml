name: Build compressed welcome kit candidate

on:
  push:
    paths:
      - '.github/workflows/compress-welcome-kit.yml'

permissions:
  contents: read

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils
      - name: Compress welcome kit
        run: |
          mkdir -p compression-review/before compression-review/after
          gs -sDEVICE=pdfwrite \
            -dCompatibilityLevel=1.6 \
            -dNOPAUSE -dQUIET -dBATCH \
            -dDetectDuplicateImages=true \
            -dCompressFonts=true -dSubsetFonts=true \
            -dDownsampleColorImages=true -dColorImageDownsampleType=/Bicubic -dColorImageResolution=180 \
            -dDownsampleGrayImages=true -dGrayImageDownsampleType=/Bicubic -dGrayImageResolution=180 \
            -dDownsampleMonoImages=true -dMonoImageDownsampleType=/Subsample -dMonoImageResolution=300 \
            -dJPEGQ=85 \
            -sOutputFile=compression-review/welcome-kit-compressed.pdf \
            downloads/welcome-kit.pdf
          pdfinfo downloads/welcome-kit.pdf > compression-review/original-info.txt
          pdfinfo compression-review/welcome-kit-compressed.pdf > compression-review/compressed-info.txt
          before_pages=$(pdfinfo downloads/welcome-kit.pdf | awk '/^Pages:/ {print $2}')
          after_pages=$(pdfinfo compression-review/welcome-kit-compressed.pdf | awk '/^Pages:/ {print $2}')
          test "$before_pages" = "$after_pages"
          cp downloads/welcome-kit.pdf compression-review/welcome-kit-original.pdf
          stat -c '%s' downloads/welcome-kit.pdf > compression-review/original-bytes.txt
          stat -c '%s' compression-review/welcome-kit-compressed.pdf > compression-review/compressed-bytes.txt
          pages="$before_pages"
          mid=$(( (pages + 1) / 2 ))
          for p in 1 "$mid" "$pages"; do
            pdftoppm -f "$p" -singlefile -png -r 144 downloads/welcome-kit.pdf "compression-review/before/page-$p"
            pdftoppm -f "$p" -singlefile -png -r 144 compression-review/welcome-kit-compressed.pdf "compression-review/after/page-$p"
          done
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: welcome-kit-compression-review
          path: compression-review/
          retention-days: 7
